name: Bug report
description: Report a reproducible defect with explicit severity.
title: "[Bug] "
labels:
  - bug
body:
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: Use the definitions in `docs/project-management/PHASE_TRACKING.md`.
      options:
        - S0 — Critical
        - S1 — High
        - S2 — Medium
        - S3 — Low
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Who or what is affected? Include tenant/security/data impact.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide deterministic steps, inputs and environment.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected versus actual
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Safe evidence
      description: Add sanitized logs, request IDs or screenshots. Never include secrets or personal data.
